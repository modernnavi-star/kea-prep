name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest already includes the Android SDK, including platform 35.
      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Build and validate the offline content pack
        shell: bash
        run: |
          node scripts/build-content-pack.js
          node scripts/validate-learning-content.js
          git diff --exit-code -- app/src/main/assets/content/master-book

      - name: Build debug APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Surface Gradle build failure
        if: steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("gradle-build.log").read_text(errors="replace").splitlines()
          patterns = re.compile(r"(^e: |Compilation error|Unresolved reference|Type mismatch|What went wrong|Execution failed|FAILURE: Build failed)", re.I)
          selected = [line.strip() for line in log if patterns.search(line)]
          for line in (selected[-20:] or log[-40:]):
              print(f"::error title=Gradle build failure::{line[:180]}")
          PY
          exit 1

      - name: Upload debug APK
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kea-prep-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
