 ['1','Sources: how we know','Ashokan inscriptions are contemporary royal records. Indica, Arthashastra, archaeology, Buddhist/Jain texts and Puranic traditions add evidence but must be compared critically.','Ashokan edicts = direct policy voice; Brahmi is a script and Prakrit is a language.'],

 ['4','Seleucus, Megasthenes and Bindusara','Chandragupta’s c. 305 BCE conventionally dated settlement with Seleucus I is linked to north-western territory, elephants and diplomacy. Megasthenes is associated with the Mauryan court. Bindusara maintained/consolidated the empire; his exact conquests are less securely documented.','Pair: Seleucus I / Megasthenes / Chandragupta. Bindusara = bridge ruler.'],

const screen=document.getElementById('screen');const $=x=>document.querySelector(x);const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const list=()=>[...folders.p1,...folders.p2];const done=id=>state.read.includes(id);const fname=f=>state.lang==='kn'?f.kn:f.n;const pct=()=>Math.round(state.read.length/list().length*100);
function icon(f){return `<span class="topicicon" style="--color:${f.c};--tint:${f.t}">${f.i}</span>`}function setTop(){let a={home:['KEA / KPSC GROUP C LEARNING LIBRARY','Every topic, one clear step at a time.','Nested syllabus map · detailed lessons · recall practice'],library:['CURRICULUM LIBRARY','Find a topic. Open a unit. Learn one lesson.','1,518 route plan · publish status shown honestly'],affairs:['CURRENT AFFAIRS VAULT','Know the date. Know the source.','Filterable 2014–2026 revision cards'],quiz:['MOCKS & ACCURACY','Attempt safely, not blindly.','+1 correct · −0.25 wrong · skipped 0']}[state.page];if(state.lang==='kn')a=['KEA / KPSC ಅಧ್ಯಯನ ಗ್ರಂಥಾಲಯ',{'home':'ಪ್ರತಿ ವಿಷಯವನ್ನು ಒಂದೊಂದು ಸ್ಪಷ್ಟ ಹಂತದಲ್ಲಿ ಕಲಿಯಿರಿ.','library':'ವಿಷಯ ಹುಡುಕಿ. ಘಟಕ ತೆರೆಯಿರಿ. ಪಾಠ ಕಲಿಯಿರಿ.','affairs':'ದಿನಾಂಕ ಮತ್ತು ಮೂಲ ತಿಳಿಯಿರಿ.','quiz':'ಊಹೆಗಿಂತ ನಿಖರತೆ ಮುಖ್ಯ.'}[state.page],'ರಚನಾತ್ಮಕ syllabus ನಕ್ಷೆ · ವಿವರವಾದ ಪಾಠ · ಮರುಪಠಣ'];$('#eyebrow').textContent=a[0];$('#topTitle').textContent=a[1];$('#topSub').textContent=a[2];$('#lang').textContent=state.lang==='kn'?'ಕ':'EN'}
function home(){let f=[folders.p1[2],folders.p1[7],folders.p2[2]];return `<section class="hero"><h2>Learn in small, exam-ready steps.</h2><p>Open a folder → choose a subtopic → read a focused lesson → recall → practise.</p></section><section class="metrics"><div class="metric"><b>${pct()}%</b><span>personal starter progress</span></div><div class="metric"><b>1,518</b><span>planned micro-lesson routes</span></div><div class="metric"><b>54</b><span>published seed lesson sections</span></div></section><div class="sectionbar" style="margin-top:17px"><h2>Continue learning</h2><button class="textbutton" onclick="go('library')">OPEN LIBRARY →</button></div>${f.map(x=>`<article class="today">${icon(x)}<div><h3>${esc(fname(x))}</h3><p>${x.pages} structured lesson routes · ${x.u.length} units</p></div><button class="mini ${done(x.id)?'done':''}" onclick="mark('${x.id}')">${done(x.id)?'✓ Read':'Open'}</button></article>`).join('')}<aside class="tip"><b>⚡</b><div><h3>Learning rule / ಕಲಿಕೆ ನಿಯಮ</h3><p>Never read a huge chapter in one pass. Learn: <b>topic → 5 facts → one comparison → 5 MCQs → next-day recall.</b></p></div></aside>`}
function library(){if(state.maurya)return mauryaView();if(state.folder)return folderView();let arr=folders[state.track];return `<div class="pagehead"><div><h2>Curriculum library</h2><p>Tap a folder, then open its subtopic. Status is visible: seed content versus planned research pages.</p></div></div><div class="notice"><b>Exam profile:</b> default is degree-level Group-C. FDA legacy and technical Group-C papers are retained as separate profiles; always match the current notification.</div><div class="switch"><button class="${state.track==='p1'?'active':''}" onclick="track('p1')">Paper 1 · GK</button><button class="${state.track==='p2'?'active':''}" onclick="track('p2')">Paper 2 · Core</button></div><p class="summaryline">${arr.reduce((n,x)=>n+x.pages,0)} page-ready routes in this paper · tap any folder to see every subtopic</p>${arr.map(folderCard).join('')}`}
function folderCard(f){return `<details class="folder"><summary>${icon(f)}<span><h3>${esc(fname(f))}</h3><p>${f.u.length} visible units · sourced study pack workflow</p></span><span class="count">${f.pages} pages</span></summary><div class="units">${f.u.map(u=>`<div class="unit ${u[2]==='maurya'?'featured':''}"><span><b>${esc(u[0])}</b><small>${u[1]} micro-lessons: quick learn, theory, examples, MCQs and revision</small></span><button onclick="openUnit('${f.id}','${u[2]||''}')">${u[2]?'OPEN DEEP PACK →':'VIEW UNIT →'}</button></div>`).join('')}<button class="textbutton" onclick="openFolder('${f.id}')">Open full folder view →</button></div></details>`}
function folderView(){let f=list().find(x=>x.id===state.folder);return `<div class="pagehead"><button class="back" onclick="backLibrary()">‹</button><div><div class="crumb">${state.track==='p1'?'Paper 1 · General Knowledge':'Paper 2 · Communication & Core'}</div><h2>${esc(fname(f))}</h2><p>${f.pages} addressable micro-lessons. Every unit is split into short theory, examples, MCQs and revision blocks.</p></div></div><div class="notice"><b>Publishing status:</b> full folder map is ready. Deep source-reviewed modules are marked <b>DEEP PACK</b>; other rows are queued for editorial expansion rather than filled with unverified filler.</div>${f.u.map((u,i)=>`<article class="lesson-card"><span class="lessonno">UNIT ${String(i+1).padStart(2,'0')} · ${u[1]} PAGES</span><h3>${esc(u[0])}${u[2]?' · DEEP PACK':''}</h3><p>Each page follows: quick learning objective → detailed explanation → Karnataka/exam link → examples → MCQs → revision card.</p><button class="openlesson" onclick="openUnit('${f.id}','${u[2]||''}')">${u[2]?'Open Mauryan lessons →':'See publishing route →'}</button></article>`).join('')}`}
function mauryaView(){if(state.lesson!==null)return mauryaLesson(maurya[state.lesson]);return `<div class="pagehead"><button class="back" onclick="closeMaurya()">‹</button><div><div class="crumb">Paper 1 · Indian History · Ancient India</div><h2>Mauryan Empire Masterclass</h2><p>12 mobile lessons · kings, wars, edicts, administration, art and Karnataka links.</p></div></div><div class="notice"><b>Learn path:</b> Study in order once; then revise by the fact hooks. Dates are BCE and may vary slightly by textbook—learn sequence and source before memorising a date.</div>${maurya.map((x,i)=>`<article class="lesson-card"><span class="lessonno">LESSON ${x[0]} · 8–12 MIN</span><h3>${esc(x[1])}</h3><p>${esc(x[2])}</p><button class="openlesson" onclick="openMaurya(${i})">Read neatly →</button></article>`).join('')}`}
function mauryaLesson(x){let facts=lessonFacts(x[0]);return `<div class="pagehead"><button class="back" onclick="closeLesson()">‹</button><div><div class="crumb">Mauryan Masterclass · Lesson ${x[0]} of 12</div><h2>${esc(x[1])}</h2><p>Read → recall → mark complete. Use the master Markdown notes for the full source pack.</p></div></div><article class="learn"><div class="quick"><b>5-minute quick learn:</b><br>${esc(x[2])}</div><h3>Key facts</h3><div class="factgrid">${facts.map(f=>`<div class="fact"><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join('')}</div><h3>Detailed explanation</h3>${lessonBody(x[0])}<div class="recall"><b>Recall without looking</b><p>${esc(x[3])}</p></div><button class="complete" onclick="mark('maurya-'+x[0])">${done('maurya-'+x[0])?'✓ Mark lesson unread':'Mark Lesson '+x[0]+' complete'}</button></article>`}
function lessonFacts(n){let d={
 '1':[['Primary evidence','Ashokan edicts'],['Language/script','Prakrit / Brahmi'],['Critical method','compare sources'],['Exam trap','script ≠ language']],
 '2':[['Region','Magadha'],['Capital','Pataliputra'],['Resource clue','fertile plains + rivers'],['Answer style','multi-factor']],
 '3':[['Founder','Chandragupta Maurya'],['Date cue','c. 321/322 BCE'],['Predecessor','Nandas'],['Capital','Pataliputra']],
 '4':[['Greek ruler','Seleucus I'],['Ambassador','Megasthenes'],['Bridge ruler','Bindusara'],['Caution','conquest details debated']],
 '5':[['Father','Bindusara'],['Title','Devanampiya Piyadasi'],['Karnataka site','Maski'],['Edict type','Minor Rock Edict']],
 '6':[['War','Kalinga'],['Date cue','c. 261 BCE'],['Source','Major Rock Edict XIII'],['Policy phrase','Dhamma-vijaya']],
 '7':[['Meaning','ethical public policy'],['Not','a new compulsory religion'],['Key idea','harmony'],['Exam distinction','Dhamma vs Buddhism']],
 '8':[['Edict V','Dhamma Mahamatras'],['Edict VIII','Dhammayatra'],['Edict XII','tolerance'],['Edict XIII','Kalinga']],
 '9':[['Capital','Pataliputra'],['Province anchors','Taxila, Ujjain, Tosali, Suvarnagiri'],['Revenue','agriculture/land revenue'],['Caution','control varied']],
 '10':[['Emblem model','Sarnath Lion Capital'],['Flag wheel','24-spoke Chakra'],['Karnataka','Maski/Brahmagiri etc.'],['Cave link','Barabar/Ajivikas']],
 '11':[['Last ruler','Brihadratha'],['Transition','Shunga'],['Date cue','c. 185 BCE'],['Explanation','multi-causal decline']],
 '12':[['Founder','Chandragupta'],['Father of Ashoka','Bindusara'],['War source','Edict XIII'],['Karnataka cue','Maski']]
 };return d[n]||[]}
function lessonBody(n){let b={
 '1':'<p>Historians reconstruct Mauryan history by combining evidence. Ashoka’s inscriptions are especially important because they are contemporary proclamations. <i>Indica</i> survives in fragments quoted by later writers. The <i>Arthashastra</i> supplies a model of statecraft, but its composition history is complex. A strong answer identifies the source before using it.</p><ul><li><b>Inscriptions:</b> policy, titles, places, official messages.</li><li><b>Archaeology:</b> pillars, caves, urban remains and material culture.</li><li><b>Literature:</b> useful, but its date and purpose must be considered.</li></ul>',
 '2':'<p>Magadha did not become powerful for one reason. Its fertile land supported agricultural surplus; river systems aided movement and communication; resources and earlier political expansion strengthened the state. Pataliputra lay near major rivers and became the Mauryan imperial centre.</p>',
 '3':'<p>Chandragupta created the Mauryan imperial base after the Nanda period. Standard exam tradition pairs him with Chanakya/Kautilya and the Nanda overthrow. His reign is also important for the north-western settlement with Seleucus and for the embassy of Megasthenes. Jain tradition later links him with Bhadrabahu and Shravanabelagola in Karnataka.</p>',
 '4':'<p>The Seleucus settlement is a classic foreign-relations question. Remember the pairing, not a dramatic invented story: Chandragupta Maurya, Seleucus I Nicator and Megasthenes. Bindusara followed Chandragupta and maintained the large empire; accounts link him to foreign contact and Taxila unrest. Exact maps of all Bindusara conquests are less certain than Ashoka’s edict evidence.</p>',
 '5':'<p>Ashoka’s inscriptions frequently use the title Devanampiya Piyadasi. The Maski inscription is especially important because it helped identify this title with Ashoka’s personal name. This is a high-yield Karnataka link. Remember that a title, a personal name, a language and a script are different categories of fact.</p>',
 '6':'<p>Major Rock Edict XIII records Ashoka’s account of Kalinga. It states that 100,000 were slain, 150,000 were deported/captured and many more died. These are the edict’s stated figures. The text expresses remorse and preference for Dhamma-vijaya—moral conquest—after the war. It does not prove that the state stopped possessing military power.</p>',
 '7':'<p>Dhamma included ethical behaviour, respect for elders, compassion, welfare, restraint and harmony among sects. Ashoka’s personal support for Buddhism is historically important, but Dhamma was framed as a wide public moral policy for a diverse realm. In an MCQ, reject any option saying it was a compulsory new religion.</p>',
 '8':'<p>Edict numbers become easy when each has one hook. Major Rock Edict V is linked with Dhamma Mahamatras; VIII with Dhammayatra; XII with religious tolerance; XIII with Kalinga and remorse. Learn the hook first, then add details. Officials such as Rajukas, Pradeshikas and Yuktas appear in the administrative vocabulary of the edicts.</p>',
 '9':'<p>The Mauryan empire had a strong centre, but its regions were not necessarily administered with identical intensity. Pataliputra was the imperial capital. Standard provincial anchors are Taxila, Ujjain, Tosali and Suvarnagiri. Agriculture and land revenue were fundamental, supported by roads, irrigation, trade and towns.</p>',
 '10':'<p>The Sarnath Lion Capital is the model for India’s State Emblem. The national flag carries the 24-spoked Ashoka Chakra, not the full lion capital. Karnataka is a major Ashokan-epigraphy region: Maski, Brahmagiri, Siddapura and Jatinga-Rameshwara are essential site cues. Barabar caves connect Ashoka with donations to Ajivikas.</p>',
 '11':'<p>After Ashoka, later rulers are less securely documented in detail. Brihadratha is conventionally remembered as the last Mauryan ruler, killed by Pushyamitra in the Shunga transition. Good answers avoid a single-cause decline theory and combine weak successors, imperial scale, provincial pressures and administrative/fiscal strain.</p>',
 '12':'<p>Use a four-column revision grid: ruler, event, source/site and policy. Example: Ashoka — Kalinga — Major Rock Edict XIII — Dhamma-vijaya. Then take 20 mixed MCQs. For every wrong answer, tag it as chronology, source, place, policy or reading error.</p>'};return b[n]||'<p>Detailed content will be published after source review.</p>'}
function affairs(){let ev=events.filter(e=>(state.year==='all'||e[0]===state.year)&&(state.cat==='all'||e[1]===state.cat));return `<div class="pagehead"><div><h2>Current Affairs Vault</h2><p>Structured exam cards; primary source must be checked before final revision.</p></div></div><div class="filters"><label>Year<select onchange="setYear(this.value)"><option value="all">All: 2014–2026</option>${['2026','2025','2024','2023','2020'].map(y=>`<option ${state.year===y?'selected':''}>${y}</option>`).join('')}</select></label><label>Category<select onchange="setCat(this.value)">${['all','Karnataka State','National','International','Sports'].map(x=>`<option value="${x}" ${state.cat===x?'selected':''}>${x==='all'?'All categories':x}</option>`).join('')}</select></label></div><p class="summaryline">${ev.length} source-aware revision cards</p>${ev.map(e=>`<article class="event"><div class="eventdate">${e[2].split(' ')[0]}<span>${e[2].split(' ')[1]} ${e[0]}</span></div><div><span class="tag">${e[1]}</span><h3>${esc(e[3])}</h3><p>${esc(e[4])}</p></div></article>`).join('')}`}
function quiz(){if(state.submitted){let good=state.answer===question.a,raw=good?1:-.25;return `<div class="pagehead"><div><h2>Mock result</h2><p>One-question preview projected to 100 marks.</p></div></div><div class="result"><b>${(raw*100).toFixed(0)} / 100</b><span>Raw ${raw.toFixed(2)} / 1 · ${good?'Correct +1':'Wrong −0.25'}</span></div><article class="learn" style="margin-top:10px"><div class="crumb">ANSWER REVIEW</div><h2>${good?'✓ Correct answer':'Correct answer: B'}</h2><p>The Act provides a three-tier Panchayat Raj structure: Gram Panchayat, Taluk Panchayat and Zilla Panchayat. A Gram Sabha is the body of voters, not the same as an elected Gram Panchayat.</p><button class="complete" onclick="resetQuiz()">Retake sample question</button></article>`}return `<div class="pagehead"><div><h2>Starter Mock</h2><p>Paper 1 sample · +1 correct · −0.25 wrong · skipped 0</p></div></div><article class="quiz"><div class="quizmeta">QUESTION 1 OF 1 · PANCHAYAT RAJ</div><div class="question">${question.q}</div><p class="kn">${question.kn}</p>${question.o.map((x,i)=>`<button class="option ${state.answer===i?'selected':''}" onclick="pick(${i})"><b>${'ABCD'[i]}</b>${x}</button>`).join('')}<div class="quizfoot"><small>${state.answer===null?'Choose one answer':'Answer selected'}</small><button class="primary" onclick="submitQuiz()">Submit</button></div></article><aside class="tip"><b>◒</b><div><h3>Full-paper calculation</h3><p>For a 100-question mock, raw score is already out of 100. This preview projects a short-set raw score only to show the logic.</p></div></aside>`}
function render(){setTop();screen.innerHTML=({home,library,affairs,quiz})[state.page]();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===state.page))}function go(p){state.page=p;state.folder=null;state.maurya=false;state.lesson=null;render()}function track(x){state.track=x;state.folder=null;render()}function openFolder(id){state.folder=id;render()}function openUnit(id,kind){state.folder=id;if(kind==='maurya')state.maurya=true;render()}function backLibrary(){state.folder=null;render()}function closeMaurya(){state.maurya=false;state.lesson=null;state.folder='history';render()}function openMaurya(n){state.lesson=n;render()}function closeLesson(){state.lesson=null;render()}function mark(id){state.read=done(id)?state.read.filter(x=>x!==id):[...state.read,id];localStorage.setItem('kea-mobile-library-read',JSON.stringify(state.read));render()}function setYear(v){state.year=v;render()}function setCat(v){state.cat=v;render()}function pick(i){state.answer=i;render()}function submitQuiz(){if(state.answer===null){alert('Select an option before submitting.');return}state.submitted=true;render()}function resetQuiz(){state.answer=null;state.submitted=false;render()}function toggleLang(){state.lang=state.lang==='en'?'kn':'en';render()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.page));render();
</script></body></html>
